 taste life twice — in the moment and in retrospect.”_  \n&gt; — Anaïs Nin\n\nI started this blog after seeing a reel about the concept of a “second brain.” It made me think — we often forget memories we thought we’d never lose. The small moments fade, even when we try to hold onto them. So here I am, documenting my year — not just for you, but also for future me.\n\n---\n\n## ✨ How 2024 Went\n\n2024 was a breakthrough year. A mix of first-times and last-times, milestones and memories. Here are some of the highlights:\n\n---\n\n### 👨‍💻 **Interning as an Android Developer at a Startup**\n\nI never imagined doing this internship in my final year. A lecturer — also a friend from my tech community — encouraged me to apply. It turned out to be the perfect opportunity to go deep into Android development, something I’d only scratched the surface of before.\n\n---\n\n### 📚 **Mentoring in Bangkit 2024 (Batch 2)**\n\nI was honored to serve as a Machine Learning Mentor in Bangkit — a program host by Dicoding and led by Google, GoTo, and Traveloka. Guiding passionate students was one of the most fulfilling experiences I’ve had. Their hunger to learn reminded me why I started in tech in the first place.\n\n\n---\n\n### 🧑‍💼 **Landing My First Full-Time Job**\n\nI had planned to start my career in Surabaya, where I graduated. But my mom wanted me closer to home — so I took a leap and looked for jobs in Batam. One month later, I landed a role, and I’m grateful for how things turned out.\n\n---\n\n### ✈️ **First Time Traveling Abroad**\n\nThree months into my job, I got the opportunity to present our AI-integrated product to our regional HQ in Singapore. It was my first international trip and my first time representing something I helped build.\n\n---\n\n## 😅 What Didn&#39;t Go So Well\n\nNot everything was smooth. Some things changed in ways I didn’t expect.\n\n---\n\n### 🤯 **Adulthood Is Harder Than Expected**\n\nIn college, I could explore anything I wanted. Now, every decision takes thought, time, and sometimes sacrifice. I’ve started to understand what people mean when they talk about the weight of adult life.\n\n---\n\n### 👨🏿‍🤝‍👨🏽 **Missing My Old Life &amp; Friends**\n\nI still hang out with my high school friends in Batam, but I miss the chaos and laughter of my college “kontrakan” days. Life used to feel lighter. I worry I’m losing touch with the people who shaped me.\n\n---\n\n### 🧠 **Wearing Too Many Hats at Work**\n\nI’m currently a solo AI Engineer and also handling QA in my company. With no senior to learn from and no junior to delegate to, I’ve had to grow fast — sometimes too fast.\n\n---\n\n### 🌀 **Twenties Chaos: Everyone’s on a Different Path**\n\nSome friends are getting promoted, some are getting married, others feel lost or lonely. Our lives are all going in different directions, and it’s hard not to compare.\n\n---\n\n## 🧭 My 2024 Personal Takeaways\n\n- Sometimes, the best opportunities come from people who believe in you. Listen to them — they often see your potential before you do.\n- Teaching isn’t just about giving — it’s also about growing. When you share what you know, you discover how much more there is to learn.\n- Your career doesn’t always follow your map. Sometimes detours — especially for family — lead you exactly where you’re meant to be.\n- Big things happen when you’re willing to say yes to growth. Keep building — people will notice.\n- Freedom doesn’t disappear — it just evolves. You still get to explore; now you just need to plan your path more carefully.\n- Friendships need effort to survive adulthood. Make space for old connections — they remind you of who you are.\n- Being thrown in the deep end is scary, but it forces you to swim. You’ll be amazed at what you’re capable of.\n- Your timeline is your own. Trust your pace, and don’t let comparison distract you from your path.\n\n\n## 🧭 Looking Ahead\n\nThis year taught me that growth doesn’t always feel good — sometimes it feels like confusion, exhaustion, and fear. But it’s still growth.\n\nIn 2025, I hope to continue sharing, documenting, and reflecting more — not just for memory, but for meaning.\n\n&gt; _“The past is not just something to remember. It’s something to build from.”_&quot;],&quot;collection&quot;:[0,&quot;blog&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;🎯 Looking Back: My 2024 Retrospective&quot;],&quot;summary&quot;:[0,&quot;From Graduation to Growth: A Year of Milestones, Firsts, and Growing Pains&quot;],&quot;date&quot;:[3,&quot;2025-05-01T17:00:00.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Growth&quot;],[0,&quot;Milestone&quot;],[0,&quot;Retrospective&quot;]]],&quot;draft&quot;:[0,false]}],&quot;render&quot;:[0,null]}],[0,{&quot;id&quot;:[0,&quot;02-2025-Retrospective-and-what-I-felt-at-Q1-2026/2025 Retrospective and what I felt at Q1 of 2026.mdx&quot;],&quot;slug&quot;:[0,&quot;02-2025-retrospective-and-what-i-felt-at-q1-2026/2025-retrospective-and-what-i-felt-at-q1-of-2026&quot;],&quot;body&quot;:[0,&quot;\nimport { Image } from \&quot;astro:assets\&quot;;\nimport coverImage from \&quot;./nick-fewings-1YgyhN8LC4w-unsplash.jpg\&quot;;\nimport gitex from \&quot;./gitex.jpeg\&quot;;\nimport apdevv from \&quot;./apdev2.jpeg\&quot;;\nimport bf from \&quot;./bestfriend.jpeg\&quot;;\nimport fish from \&quot;./fish.jpeg\&quot;;\nimport fishingg from \&quot;./fishing2.jpeg\&quot;;\nimport gym from \&quot;./gym.jpeg\&quot;;\nimport reunited from \&quot;./reunited.jpeg\&quot;;\nimport reunitedd from \&quot;./reunited2.jpeg\&quot;;\nimport reuniteddd from \&quot;./reunited3.jpeg\&quot;;\n\n&lt;Image \n  src={coverImage} \n  alt=\&quot;Nature view representing a reflective journey\&quot; \n  width={800} \n  height={400} \n/&gt;\n\n2025 felt like a roller coaster of mixed emotions. It was a year where I got to know myself more deeply both physically and mentally.\n\nAt the beginning of the year, I realized that I had gained weight and was becoming overweight. At the same time, I felt mentally exhausted and close to burnout. However, as the year progressed—especially toward the middle and the end I started to recover and feel better.\n\nIf I had to summarize this year in one quote, it would be:\n\n&gt; “One does not become enlightened by imagining figures of light, but by making the darkness conscious.” — Carl Jung\n\nThis year taught me to accept myself understanding my strengths, my weaknesses, and reconnecting with my dreams. I almost got too comfortable in my comfort zone, which nearly made me forget my goals and limited my personal growth.\n\nI also spent a lot of time doom scrolling. But interestingly, some content that appeared on my timeline reminded me of my goals and made me reflect on my age and life direction. Being in what people call the “quarter life phase,” I started receiving common questions:\n- When will you get married?\n- What have you achieved at your age?\n- What have you bought or built?\n\n---\n\n## What I Learned &amp; Experienced in 2025\n\n### 1. Reconnecting with Friends in Batam\n\n&lt;div\n  style={{\n    display: \&quot;grid\&quot;,\n    gridTemplateColumns: \&quot;2fr 2fr 1fr\&quot;,\n    gap: \&quot;16px\&quot;,\n  }}\n&gt;\n  {/* Row 1 */}\n  &lt;Image\n    src={reunited}\n    alt=\&quot;Friends gathering and reconnecting over dinner in Batam\&quot;\n    style={{ width: \&quot;100%\&quot;, height: \&quot;100%\&quot;, objectFit: \&quot;cover\&quot; }}\n  /&gt;\n\n  &lt;Image\n    src={reunitedd}\n    alt=\&quot;Receiving recognition at a tech or community event\&quot;\n    style={{ width: \&quot;100%\&quot;, height: \&quot;100%\&quot;, objectFit: \&quot;cover\&quot; }}\n  /&gt;\n\n  {/* Empty space (top right) */}\n  &lt;div /&gt;\n\n  {/* Row 2 - FULL WIDTH */}\n  &lt;div style={{ gridColumn: \&quot;1 / -1\&quot; }}&gt;\n    &lt;Image\n      src={reuniteddd}\n      alt=\&quot;Casual moment with friends hanging out and sharing stories\&quot;\n      style={{ width: \&quot;100%\&quot;, height: \&quot;100%\&quot;, objectFit: \&quot;cover\&quot; }}\n    /&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\nLiving and working in Batam gave me the opportunity to reconnect with friends.\n\nWe spent time together by:\n- Starting small business ideas as an excuse to meet\n- Helping with a friend’s wedding\n- Sharing life updates and stories\n\nOne realization stood out:  \nAs we grow older, time with friends becomes more limited.\n\nThis reminded me of the Japanese concept:\n&gt; *Ichigo Ichie* — cherish every moment, because it may never happen again.\n\n**Key takeaway:**\n- Value the present and the people around you while you still can.\n\n---\n\n### 2. Becoming More Aware of My Health\n\n&lt;Image \n  src={gym} \n  alt=\&quot;Gym session reflecting commitment to health and recovery\&quot;\n  width={800} \n  height={400}\n  style={{ filter: \&quot;grayscale(100%)\&quot; }}\n/&gt;\n\nI noticed I was no longer physically fit. This became very real when I joined a 5K fun run—it was much harder than I expected.\n\nBack in high school, this would have been easy. But since college, I had stopped exercising regularly.\n\nOne of the best decisions I made this year was subscribing to a gym membership.\n\nAfter consistently working out:\n- I felt physically healthier\n- My stress levels decreased\n- My mental state became more stable\n\nI also noticed some friends starting to experience health issues like *asam urat* (gout), likely due to lifestyle and lack of physical activity.\n\n**Key takeaway:**\n- Health is a long term investment. Exercise is not optional—it’s essential.\n\n---\n\n### 3. Exploring Communities and Events\n\n&lt;div\n  style={{\n    display: \&quot;flex\&quot;,\n    gap: \&quot;16px\&quot;,\n    alignItems: \&quot;flex-start\&quot;,\n  }}\n&gt;\n  &lt;Image \n    src={apdevv} \n    alt=\&quot;Application development moment\&quot;\n    width={800} \n    height={400}\n    style={{ width: \&quot;50%\&quot;, height: \&quot;auto\&quot; }}\n  /&gt;\n\n  &lt;Image \n    src={gitex} \n    alt=\&quot;Gitex event experience\&quot;\n    width={800} \n    height={400}\n    style={{ width: \&quot;50%\&quot;, height: \&quot;auto\&quot; }}\n  /&gt;\n&lt;/div&gt;\n\nThis year, I truly enjoyed living in Batam especially because of the people.\n\nThe Gen Z communities I met here was genuinely positive and inspiring. Instead of negative habits, we connected through:\n- Book gatherings\n- Singing sessions\n- Casual conversations (“yapping”)\n- Sharing life updates and even financial advice\n\nIn addition, I became active again in tech communities and events. One highlight was attending an international conference:\n- Gitex Asia Singapore 2025\n\n**Key takeaway:**\n- The right environment and community can significantly shape your mindset and growth.\n\n---\n\n### 4. Trying New Hobbies: Fishing\n\n&lt;div\n  style={{\n    display: \&quot;grid\&quot;,\n    gridTemplateColumns: \&quot;2fr 2fr 1fr\&quot;,\n    gap: \&quot;16px\&quot;,\n  }}\n&gt;\n  {/* Row 1 */}\n  &lt;Image\n    src={fish}\n    alt=\&quot;Fish that we caught\&quot;\n    style={{ width: \&quot;100%\&quot;, height: \&quot;100%\&quot;, objectFit: \&quot;cover\&quot; }}\n  /&gt;\n\n  &lt;Image\n      src={fishingg}\n      alt=\&quot;Moment taken when we are fishing\&quot;\n      style={{ width: \&quot;100%\&quot;, height: \&quot;100%\&quot;, objectFit: \&quot;cover\&quot; }}\n    /&gt;\n&lt;/div&gt;\n\nFor the first time, I went ocean fishing and surprisingly, I caught 3 fish!\n\nBut more than the results, the experience mattered:\n- Enjoying the ocean waves\n- Feeling the wind\n- Laughing and bonding with friends\n\nIt wasn’t just about fishing it was about being present in nature and sharing moments.\n\n**Key takeaway:**\n- New experiences don’t have to be productive—they just need to be meaningful.\n\n---\n\n## Challenges &amp; Realizations\n\nNot everything went as planned.\n\nAs we grow older, many of us face a *quarter-life crisis*:\n- Comparing ourselves to others’ achievements\n- Struggling with relationships or moving on\n- Questioning our life direction\n\nThese are things we were never taught in formal education but we learn them through experience.\n\nAt the same time, we live in a world of constant information:\n- Easy access through one device\n- Endless dopamine through scrolling\n- Hidden impact on time, focus, and mental health\n\nEven though I won’t go into specific details, I’m grateful that:\n- I invested in my health (gym)\n- I found supportive friends who understand and support each other\n\n**Key takeaway:**\n- Growth comes with discomfort, confusion, and comparison but awareness is the first step forward.\n\n---\n\n## Closing Reflection on 2025\n\nI feel deeply grateful for this year.\n\nBecause above all, I now understand myself better.\n\nAnd I believe:\n&gt; Knowing yourself is the first milestone before achieving anything else.\n\n---\n\n## Q1 2026: A New Spark\n\nIn the first quarter of 2026, I feel like I’ve regained clarity.\n\nNow:\n- I have a better sense of who I want to become\n- I feel motivated again after feeling lost last year\n- I’m exploring new activities and hobbies\n- I’m consistently writing a daily journal in English to improve myself\n\nI’m excited for what’s ahead.\n\nI can’t wait to look back at the end of 2026 and see:\n- What I’ve achieved\n- How much I’ve grown\n- And what has shaped me into a better version of myself\n\n---\n\n## Final Takeaways\n\n- Self-awareness is the foundation of growth  \n- Health is one of the best investments you can make  \n- Relationships become more valuable as time passes  \n- Community shapes mindset and direction  \n- Growth is uncomfortable but necessary  \n- Consistency beats motivation  \n\n---\n\n&lt;Image\n  src={bf}\n  alt=\&quot;Moment taken when we are talking\&quot;\n  style={{ width: \&quot;100%\&quot;, height: \&quot;100%\&quot;, objectFit: \&quot;cover\&quot; }}\n/&gt;\nBonus pict we knew tomorrow was a weekday, and one of us was going through a rough moment—but we stayed, shared a meal, and talked until midnight.\n&quot;],&quot;collection&quot;:[0,&quot;blog&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;A Retrospective of 2025 and My Perspective in Q1 2026&quot;],&quot;summary&quot;:[0,&quot;A Year of Contemplation and Reflection, A year of get to know about myself&quot;],&quot;date&quot;:[3,&quot;2026-04-01T17:00:00.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Growth&quot;],[0,&quot;Milestone&quot;],[0,&quot;Retrospective&quot;]]],&quot;draft&quot;:[0,false]}],&quot;render&quot;:[0,null]}],[0,{&quot;id&quot;:[0,&quot;first_project.mdx&quot;],&quot;slug&quot;:[0,&quot;first_project&quot;],&quot;body&quot;:[0,&quot;&quot;],&quot;collection&quot;:[0,&quot;projects&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;First Project&quot;],&quot;summary&quot;:[0,&quot;Lorem Ipsum&quot;],&quot;date&quot;:[3,&quot;2026-04-02T00:00:00.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;AI&quot;],[0,&quot;Web&quot;],[0,&quot;Astro&quot;]]],&quot;draft&quot;:[0,false]}],&quot;render&quot;:[0,null]}]]]}" ssr="" client="load" opts="{&quot;name&quot;:&quot;Search&quot;,&quot;value&quot;:true}" await-children=""><div data-hk="s00000" class="flex flex-col"><div class="relative"><input name="search" type="text" value="" autocomplete="off" spellcheck="false" placeholder="What are you looking for?" class="w-full px-2.5 py-1.5 pl-10 rounded outline-none text-black dark:text-white bg-black/5 dark:bg-white/15 border border-black/10 dark:border-white/20 focus:border-black focus:dark:border-white"><svg class="absolute size-6 left-1.5 top-1/2 -translate-y-1/2 stroke-current"><use href="/ui.svg#search"></use></svg></div><!--$--><!--/--></div><!--astro:end--></astro-island> </div>   </div> </div>  </main> <footer class="relative bg-white dark:bg-black"> <div class="animate"> <section class="py-5"> <div class="w-full h-full mx-auto px-5 max-w-screen-md">  <div class="flex items-center justify-center sm:justify-end"> <button id="back-to-top" aria-label="Back to top of
